<!doctype html>
<html lang="sv"><head><meta charset="utf-8">
<style>html,body{margin:0;background:#111}canvas{display:block;width:1080px;height:1920px}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=1080,H=1920,DUR=66;
const CREAM='#F3EFE6',ORANGE='#EE6A45',INK='#111111',PURPLE='#7B5CFF',GOLD='#E2B04A',PAPER='#FFFDF8';
const SANS='"Arial Black","Helvetica Neue",Arial,sans-serif';
const MONO='"Courier New",ui-monospace,monospace';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>x>=1?1:1-Math.pow(2,-10*x);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eb=x=>{x=clamp(x);const c=1.2;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=s=>{const x=Math.sin(s*127.1+311.7)*43758.5453;return x-Math.floor(x)};

function bg(){
  ctx.fillStyle=CREAM;ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(W/2,H*0.42,H*0.32,W/2,H*0.42,H*0.8);
  g.addColorStop(0,'rgba(123,92,255,0)');g.addColorStop(1,'rgba(123,92,255,0.5)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function sun(cx,cy,r,alpha=1){
  ctx.save();ctx.globalAlpha=alpha;ctx.beginPath();ctx.arc(cx,cy,Math.max(0,r),0,Math.PI*2);
  ctx.fillStyle=ORANGE;ctx.shadowColor='rgba(238,106,69,0.55)';ctx.shadowBlur=70;ctx.fill();ctx.restore();
}
function txt(s,x,y,size,o={}){
  const {font=SANS,col=INK,align='center',ls=0,glitch=0,seed=0,alpha=1,clipH=null}=o;
  ctx.save();
  ctx.font=`${size}px ${font}`;ctx.textAlign=align;ctx.textBaseline='alphabetic';
  ctx.letterSpacing=ls+'px';
  if(clipH!==null){ctx.beginPath();ctx.rect(0,y-size*1.2,W,size*1.2+clipH);ctx.clip();}
  if(glitch>0){
    const d=glitch*24;
    ctx.globalAlpha=alpha*0.9;ctx.fillStyle='#00E5FF';ctx.fillText(s,x-d,y);
    ctx.fillStyle='#FF2D7A';ctx.fillText(s,x+d,y);
    for(let i=0;i<4;i++){
      const sy=y-size*(0.15+rnd(seed*7+i)*0.95),sh=size*(0.12+rnd(seed+i)*0.12);
      const dx=(rnd(seed*3+i+1)-.5)*glitch*160;
      ctx.save();ctx.beginPath();ctx.rect(0,sy,W,sh);ctx.clip();
      ctx.globalAlpha=alpha;ctx.fillStyle=col;ctx.fillText(s,x+dx,y);ctx.restore();
    }
  }
  ctx.globalAlpha=alpha;ctx.fillStyle=col;ctx.fillText(s,x,y);
  ctx.restore();
}
// reveal from bottom: a in 0..1
const reveal=(a)=>a>=1?null:(-1.2*1+1.6*a); // multiplier of size used below
function revealTxt(s,x,y,size,a,o={}){
  if(a<=0)return;
  const clip=a>=1?null:(-1.2*size+1.6*size*a);
  txt(s,x,y,size,{...o,clipH:clip});
}
function hud(t){
  ctx.save();ctx.strokeStyle=INK;ctx.lineWidth=5;const m=40,L=56;
  [[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(([x,y,sx,sy])=>{
    ctx.beginPath();ctx.moveTo(x,y+sy*L);ctx.lineTo(x,y);ctx.lineTo(x+sx*L,y);ctx.stroke();
  });
  ctx.restore();
  txt('SVERIGE · ASYL',m+24,m+64,26,{font:MONO,align:'left',ls:2});
  const s=Math.floor(t),f=Math.floor((t%1)*30);
  txt(`00:${String(s).padStart(2,'0')}:${String(f).padStart(2,'0')}`,W-m-24,m+64,26,{font:MONO,align:'right',ls:2});
  ctx.fillStyle='rgba(17,17,17,0.15)';ctx.fillRect(80,H-150,W-160,8);
  ctx.fillStyle=INK;ctx.fillRect(80,H-150,(W-160)*t/DUR,8);
}
function traveler(x,y,s,walk){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  const b=Math.abs(Math.sin(walk*5))*6;
  ctx.fillStyle=INK;
  ctx.fillRect(-30,-90-b+90,24,90+Math.sin(walk*5)*14);
  ctx.fillRect(6,-90-b+90,24,90-Math.sin(walk*5)*14);
  ctx.beginPath();ctx.roundRect(-36,-190-b+60,72,120,22);ctx.fill();
  ctx.beginPath();ctx.arc(0,-232-b+60,34,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=ORANGE;ctx.beginPath();ctx.roundRect(28,-160-b+60,50,70,10);ctx.fill();
  ctx.restore();
}

// ---- route (scene 2 and 6)
const ROUTE=[[150,1420],[450,1420],[450,980],[930,980],[930,560]];
const RL=[0];for(let i=1;i<ROUTE.length;i++)RL.push(RL[i-1]+Math.hypot(ROUTE[i][0]-ROUTE[i-1][0],ROUTE[i][1]-ROUTE[i-1][1]));
const RT=RL[RL.length-1];
function pointAt(s){
  const d=clamp(s)*RT;
  for(let i=1;i<ROUTE.length;i++){
    if(d<=RL[i]){const f=(d-RL[i-1])/(RL[i]-RL[i-1]);
      return [lerp(ROUTE[i-1][0],ROUTE[i][0],f),lerp(ROUTE[i-1][1],ROUTE[i][1],f)];}
  }
  return ROUTE[ROUTE.length-1];
}
function drawRoute(prog){
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle='rgba(17,17,17,0.12)';ctx.lineWidth=26;
  ctx.beginPath();ROUTE.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();
  ctx.strokeStyle=ORANGE;ctx.lineWidth=26;ctx.beginPath();
  const d=clamp(prog)*RT;ctx.moveTo(ROUTE[0][0],ROUTE[0][1]);
  for(let i=1;i<ROUTE.length;i++){
    if(d>=RL[i]){ctx.lineTo(ROUTE[i][0],ROUTE[i][1]);}
    else{const f=(d-RL[i-1])/(RL[i]-RL[i-1]);
      ctx.lineTo(lerp(ROUTE[i-1][0],ROUTE[i][0],f),lerp(ROUTE[i-1][1],ROUTE[i][1],f));break;}
  }
  ctx.stroke();ctx.restore();
}
const STATIONS=[
  {f:0,l:'Gränsen',side:'below'},
  {f:.25,l:'Ansökan',side:'right'},
  {f:.5,l:'Screening',side:'above'},
  {f:.75,l:'Intervju',side:'above'},
  {f:1,l:'Beslut',side:'left'}
];
function stations(prog,alphaLabel=1){
  STATIONS.forEach((st,i)=>{
    const [x,y]=pointAt(st.f);
    const lit=prog>=st.f-0.001;
    ctx.save();ctx.beginPath();ctx.arc(x,y,30,0,Math.PI*2);
    ctx.fillStyle=lit?ORANGE:PAPER;ctx.fill();ctx.lineWidth=8;ctx.strokeStyle=INK;ctx.stroke();ctx.restore();
    let lx=x,ly=y,al='center';
    if(st.side==='right'){lx=x+58;ly=y+16;al='left';}
    if(st.side==='left'){lx=x-58;ly=y+16;al='right';}
    if(st.side==='below'){lx=x;ly=y+96;al='center';}
    if(st.side==='above'){lx=x;ly=y-66;al='center';}
    txt(st.l.toUpperCase(),lx,ly,44,{font:MONO,align:al,ls:1,alpha:lit?alphaLabel:0.3});
  });
}

// ---- SCENE 1: 0..11
function S1(t){
  sun(540,820,430*eo(seg(t,0,1.4)));
  if(t<3.3){
    txt('SÖKER DU ASYL?',540,430,90,{glitch:Math.max(0,1-t/0.9),seed:3,alpha:1-seg(t,2.7,3.3)});
  }
  const a=seg(t,3.3,4.6);
  const g1=t>3.8&&t<4.4?0.9:Math.max(0,1-seg(t,4.6,5.6))*0.7;
  revealTxt('VÄLKOMMEN',540,1490,150,a,{glitch:g1,seed:9});
  revealTxt('TILL SVERIGE',540,1620,104,seg(t,5.2,6.2),{seed:4});
  // horizon + traveler
  ctx.fillStyle=INK;ctx.fillRect(0,1250,W,5);
  const walkX=lerp(-160,540,eio(seg(t,0,7)));
  traveler(walkX,1250,1.5,t*1.2);
  // fade the traveler once he reaches the sun center
  if(t>7.2){ctx.save();ctx.globalAlpha=0;ctx.restore();}
}

// ---- SCENE 2: 11..22 (local 0..11)
function S2(t){
  const a=seg(t,0,.8);
  revealTxt('RESAN',540,330,160,a,{glitch:Math.max(0,1-seg(t,.8,1.6))*0.8,seed:12});
  txt('steg för steg',540,410,40,{font:MONO,ls:4,alpha:seg(t,1,1.6)});
  const p=eio(seg(t,.6,6.8));
  drawRoute(p);
  stations(p);
  const [dx,dy]=pointAt(p);
  ctx.save();ctx.beginPath();ctx.arc(dx,dy,44,0,Math.PI*2);ctx.fillStyle='rgba(238,106,69,0.25)';ctx.fill();
  ctx.beginPath();ctx.arc(dx,dy,22,0,Math.PI*2);ctx.fillStyle=INK;ctx.fill();ctx.restore();
  if(t>7.3){txt('Kolla vad som händer nu →',540,1640,50,{font:MONO,alpha:seg(t,7.3,8)});}
}

// ---- SCENE 3: 22..33 (local 0..11)
function card(x,y,w,h,label,t,ent){
  ctx.save();ctx.shadowColor='rgba(17,17,17,0.18)';ctx.shadowBlur=40;ctx.shadowOffsetY=18;
  ctx.fillStyle=PAPER;ctx.beginPath();ctx.roundRect(x,y,w,h,36);ctx.fill();ctx.restore();
  ctx.save();ctx.lineWidth=6;ctx.strokeStyle=INK;ctx.beginPath();ctx.roundRect(x,y,w,h,36);ctx.stroke();ctx.restore();
  txt(label,x+50,y+70,46,{font:MONO,align:'left',ls:2});
  ctx.save();ctx.fillStyle=ORANGE;ctx.beginPath();ctx.arc(x+w-60,y+60,18,0,Math.PI*2);ctx.fill();ctx.restore();
}
function S3(t){
  revealTxt('KONTROLL',540,330,150,seg(t,0,.8),{glitch:Math.max(0,1-seg(t,.8,1.6))*0.8,seed:21});
  const ys=[480,900,1320];const labels=['IDENTITET','FINGERAVTRYCK','DUBLIN'];
  ys.forEach((y,i)=>{
    const e=eb(seg(t,0.5+i*0.9,1.5+i*0.9));
    const x=lerp(W+500,120,e);
    ctx.save();ctx.translate(x,0);
    card(0,y,840,330,labels[i],t);
    ctx.restore();
    // content
    const cx=x;
    if(i===0){ // ID card content
      ctx.save();ctx.fillStyle=INK;ctx.beginPath();ctx.arc(cx+160,y+190,70,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.roundRect(cx+80,y+230,160,80,40);ctx.fill();ctx.restore();
      ctx.save();ctx.fillStyle=INK;for(let k=0;k<4;k++){ctx.fillRect(cx+340,y+150+k*40,380-k*60,14);}ctx.restore();
    }
    if(i===1){ // fingerprint arcs
      const pr=seg(t,1.4+i*0.9,3.2+i*0.9);
      ctx.save();ctx.strokeStyle=INK;ctx.lineWidth=10;ctx.lineCap='round';
      for(let k=0;k<6;k++){
        const r=30+k*18;ctx.beginPath();
        ctx.arc(cx+230,y+215,r,Math.PI*0.9,Math.PI*0.9+Math.PI*1.2*pr+0.001);ctx.stroke();
      }
      ctx.restore();
      ctx.save();ctx.fillStyle=ORANGE;ctx.fillRect(cx+420,y+150,300*pr,22);ctx.restore();
    }
    if(i===2){ // europe blob + SE dot
      ctx.save();ctx.fillStyle='rgba(17,17,17,0.12)';
      ctx.beginPath();ctx.ellipse(cx+300,y+180,240,120,0.1,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=ORANGE;const pu=0.6+0.4*Math.sin(t*6);
      ctx.beginPath();ctx.arc(cx+520,y+130,22*pu,0,Math.PI*2);ctx.fill();
      ctx.restore();
      txt('SE',cx+520,y+100,36,{font:MONO,alpha:seg(t,2.5+i*0.9,3.2+i*0.9)});
    }
  });
  txt('Flera kontroller samtidigt',540,1740,36,{font:MONO,alpha:seg(t,6,7)});
}

// ---- SCENE 4: 33..44 (local 0..11)
function person(x,y,fill,stroke){
  ctx.save();ctx.fillStyle=fill;ctx.strokeStyle=INK;ctx.lineWidth=8;
  ctx.beginPath();ctx.arc(x,y,100,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.roundRect(x-120,y+140,240,420,110);ctx.fill();ctx.stroke();
  ctx.restore();
}
function bubble(x,y,w,h,t,dots){
  ctx.save();ctx.fillStyle=PAPER;ctx.strokeStyle=INK;ctx.lineWidth=6;
  ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,30);ctx.fill();ctx.stroke();ctx.restore();
  if(dots){for(let k=0;k<3;k++){const on=Math.floor(t*3)%3===k;ctx.save();ctx.fillStyle=on?ORANGE:INK;ctx.beginPath();ctx.arc(x-40+k*40,y,11,0,Math.PI*2);ctx.fill();ctx.restore();}}
}
function S4(t){
  // opening wipe
  const w=1-eio(seg(t,0,.7));
  revealTxt('INTERVJU',540,330,140,seg(t,0.2,1),{glitch:Math.max(0,1-seg(t,1,1.8))*0.7,seed:33});
  txt('tolk · sekretess',540,410,40,{font:MONO,ls:4,alpha:seg(t,.8,1.4)});
  const pe=eb(seg(t,.2,1.2)), pt=eb(seg(t,.4,1.4)), pu=eb(seg(t,.6,1.6));
  person(250,930*1+0-0,PAPER);
  person(540,930,ORANGE);
  person(830,930,INK);
  // reveal scale-in via pe (cosmetic)
  txt('Sökande',250,1620,44,{font:MONO,alpha:seg(t,1,1.5)});
  txt('Tolk',540,1620,44,{font:MONO,alpha:seg(t,1,1.5)});
  txt('Utredare',830,1620,44,{font:MONO,alpha:seg(t,1,1.5)});
  if(t>1.2&&t<4.5)bubble(830,640,260,130,t,false),txt('?',830,668,80,{alpha:1});
  if(t>3.0&&t<6.2)bubble(540,600,300,140,t,false),txt('tolkar…',540,618,40,{font:MONO});
  if(t>5.5)bubble(250,640,260,130,t,true);
  // opening wipe overlay
  if(w>0){ctx.save();ctx.fillStyle=INK;ctx.fillRect(0,0,W*w,H);ctx.restore();}
}

// ---- SCENE 5: 44..55 (local 0..11)
function S5(t){
  revealTxt('BESLUT',540,330,150,seg(t,0,.8),{seed:44});
  const n=Math.round(seg(t,0.4,3.2)*6);
  txt(String(n),540,820,360,{col:INK,glitch:Math.max(0,0.4-seg(t,2.5,3.2)),seed:5});
  txt('månader',540,930,80,{font:MONO,ls:2,alpha:seg(t,1,1.6)});
  txt('utan fast tid för beslut',540,1000,40,{font:MONO,alpha:seg(t,3.2,4)});
  // clock
  const cx=540,cy=1200,r=130;
  ctx.save();ctx.strokeStyle=INK;ctx.lineWidth=10;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();ctx.restore();
  ctx.save();ctx.strokeStyle=INK;ctx.lineWidth=10;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx,cy);
  ctx.lineTo(cx+Math.cos(t*2.4-Math.PI/2)*r*0.8,cy+Math.sin(t*2.4-Math.PI/2)*r*0.8);ctx.stroke();ctx.restore();
  // decision card flip
  const f=eio(seg(t,4,5.2));
  const ang=f*Math.PI;const sx=Math.cos(ang);
  const x=240,y=1380,w=600,h=280;
  ctx.save();ctx.translate(x+w/2,y+h/2);ctx.scale(Math.max(0.02,Math.abs(sx)),1);
  ctx.shadowColor='rgba(17,17,17,0.2)';ctx.shadowBlur=30;ctx.shadowOffsetY=14;
  ctx.fillStyle=sx>=0?PAPER:ORANGE;ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,30);ctx.fill();
  ctx.shadowColor='transparent';ctx.lineWidth=8;ctx.strokeStyle=INK;ctx.stroke();
  ctx.restore();
  if(sx>=0){
    ctx.save();ctx.globalAlpha=1;ctx.restore();
  }
  if(f<0.5){
    txt('AVGÖRANDE',x+w/2,y+h/2+16,54,{font:MONO,ls:2,col:INK,alpha:1-f*2});
  } else {
    txt('BESLUT',x+w/2,y+h/2+22,90,{col:INK,alpha:(f-0.5)*2,glitch:Math.max(0,0.6-seg(t,5.2,5.9)),seed:7});
  }
  txt('Du får ett beslut',540,1740,36,{font:MONO,alpha:seg(t,6,7)});
}

// ---- SCENE 6: 55..66 (local 0..11)
function S6(t){
  const s=lerp(1.25,0.9,eio(seg(t,0,4)));
  sun(540,820,260*s,0.28);
  ctx.save();ctx.translate(540,820);ctx.scale(s,s);ctx.translate(-540,-990);
  drawRoute(1);
  ctx.restore();
  // stations with final lit
  ctx.save();ctx.translate(540,820);ctx.scale(s,s);ctx.translate(-540,-990);
  stations(1,1);
  ctx.restore();
  const a=seg(t,3.6,4.6);
  revealTxt('KOLLA SJÄLV',540,1560,120,a,{glitch:Math.max(0,1-seg(t,4.6,5.6))*0.8,seed:66});
  txt('migrationsverket.se',540,1640,52,{font:MONO,alpha:seg(t,5,5.8)});
  txt('Allmän information, inte juridisk rådgivning',540,1710,30,{font:MONO,alpha:seg(t,6,7)});
}

function trans(t){
  for(const b of [11,22,33,44,55]){
    const d=t-b;
    if(Math.abs(d)<0.35){
      ctx.save();ctx.globalAlpha=1-Math.abs(d)/0.35;ctx.fillStyle=ORANGE;ctx.fillRect(0,0,W,H);ctx.restore();
    }
  }
}

function render(t){
  t=clamp(t,0,DUR);
  bg();
  if(t<11)S1(t);
  else if(t<22)S2(t-11);
  else if(t<33)S3(t-22);
  else if(t<44)S4(t-33);
  else if(t<55)S5(t-44);
  else S6(t-55);
  trans(t);
  hud(t);
  if(t>DUR-0.4){ctx.save();ctx.globalAlpha=(t-(DUR-0.4))/0.4;ctx.fillStyle=CREAM;ctx.fillRect(0,0,W,H);ctx.restore();}
}
window.render=render;
window.ready=true;
render(0);
</script>
</body></html>
